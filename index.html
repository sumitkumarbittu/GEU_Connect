<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEU Academic Connect</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/static/styles.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#" onclick="showPage('home')" class="brand">
                <i class="fas fa-graduation-cap"></i> GEU Academic Connect
            </a>
            <div class="nav-links">
                <a href="#" onclick="showPage('home')" class="active">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" onclick="showPage('login')" id="login-link">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="#" onclick="showPage('register')" id="register-link">
                    <i class="fas fa-user-plus"></i> Register
                </a>
                <a href="#" onclick="logout()" id="logout-link" class="hidden">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Home Page -->
        <div id="home" class="page active">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">Welcome to GEU Academic Connect</h1>
                </div>
                <div class="card-content">
                    <p>Book appointments with your teachers easily and efficiently.</p>
                    
                    <div id="home-guest" class="hidden">
                        <p>Please login or register to continue.</p>
                        <div class="mt-3">
                            <button onclick="showPage('login')" class="btn btn-primary mr-2">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                            <button onclick="showPage('register')" class="btn btn-secondary">
                                <i class="fas fa-user-plus"></i> Register
                            </button>
                        </div>
                    </div>
                    
                    <div id="home-user" class="hidden">
                        <div class="alert alert-info">
                            <i class="fas fa-user-circle"></i> Welcome back, <strong id="user-email"></strong>!
                        </div>
                        <div id="user-actions" class="mt-4">
                            <!-- Dynamic content based on user role -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Login Page -->
        <div id="login" class="page">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Login</h2>
                </div>
                <div class="card-content">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Email:</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="login-email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password:</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="login-password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>
                    <div id="login-message" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Register Page -->
        <div id="register" class="page">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Create an Account</h2>
                </div>
                <div class="card-content">
                    <form id="register-form">
                        <div class="form-group">
                            <label for="register-email">Email:</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="register-email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="register-password">Password:</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="register-password" placeholder="Create a password" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="register-role">I am a:</label>
                            <div class="select-wrapper">
                                <i class="fas fa-user-tag"></i>
                                <select id="register-role" required>
                                    <option value="">Select role</option>
                                    <option value="student">Student</option>
                                    <option value="teacher">Teacher</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-user-plus"></i> Register
                        </button>
                    </form>
                    <div id="register-message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple client-side routing
        function showPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Show the selected page
            const page = document.getElementById(pageId);
            if (page) {
                page.classList.add('active');
            }
            
            // Update navigation
            updateNavigation();
        }

        // Current user state
        let currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');

        // Update navigation based on authentication state
        function updateNavigation() {
            const loginLink = document.getElementById('login-link');
            const registerLink = document.getElementById('register-link');
            const logoutLink = document.getElementById('logout-link');
            const homeGuest = document.getElementById('home-guest');
            const homeUser = document.getElementById('home-user');
            const userEmail = document.getElementById('user-email');
            const userActions = document.getElementById('user-actions');

            if (currentUser) {
                // User is logged in
                loginLink.parentElement.style.display = 'none';
                registerLink.parentElement.style.display = 'none';
                logoutLink.classList.remove('hidden');
                
                // Update home page for logged-in user
                if (homeGuest) homeGuest.classList.add('hidden');
                if (homeUser) {
                    homeUser.classList.remove('hidden');
                    if (userEmail) userEmail.textContent = currentUser.email;
                    
                    // Update actions based on user role
                    if (userActions) {
                        if (currentUser.role === 'teacher') {
                            userActions.innerHTML = `
                                <h3><i class="fas fa-chalkboard-teacher"></i> Teacher Dashboard</h3>
                                <div class="button-group">
                                    <button onclick="showPage('create-slot')" class="btn btn-primary">
                                        <i class="fas fa-plus-circle"></i> Create Time Slot
                                    </button>
                                    <button onclick="showPage('my-slots')" class="btn btn-secondary">
                                        <i class="fas fa-calendar-alt"></i> View My Slots
                                    </button>
                                </div>
                            `;
                        } else {
                            userActions.innerHTML = `
                                <h3><i class="fas fa-user-graduate"></i> Student Dashboard</h3>
                                <div class="button-group">
                                    <button onclick="showPage('book-slot')" class="btn btn-primary">
                                        <i class="fas fa-book"></i> Book a Slot
                                    </button>
                                    <button onclick="showPage('my-bookings')" class="btn btn-secondary">
                                        <i class="fas fa-list"></i> My Bookings
                                    </button>
                                </div>
                            `;
                        }
                    }
                }
            } else {
                // User is not logged in
                loginLink.parentElement.style.display = 'block';
                registerLink.parentElement.style.display = 'block';
                logoutLink.classList.add('hidden');
                
                // Update home page for guest
                if (homeGuest) homeGuest.classList.remove('hidden');
                if (homeUser) homeUser.classList.add('hidden');
            }
        }

        // Login form submission
        document.getElementById('login-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const messageDiv = document.getElementById('login-message');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentUser = data.user;
                    sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showAlert('Login successful!', 'success');
                    showPage('home');
                    updateNavigation();
                } else {
                    showAlert(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
                console.error('Login error:', error);
            }
        });

        // Register form submission
        document.getElementById('register-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const role = document.getElementById('register-role').value;
            const messageDiv = document.getElementById('register-message');
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password, role })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('Registration successful! Please login.', 'success');
                    showPage('login');
                    // Pre-fill the login form
                    document.getElementById('login-email').value = email;
                } else {
                    showAlert(data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
                console.error('Registration error:', error);
            }
        });

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} fade-in`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            
            // Add to the current page's message container
            const currentPage = document.querySelector('.page.active');
            const messageDiv = currentPage.querySelector('#login-message, #register-message') || currentPage;
            
            // Clear existing messages
            const existingAlerts = messageDiv.querySelectorAll('.alert');
            existingAlerts.forEach(alert => alert.remove());
            
            // Add new message
            messageDiv.prepend(alertDiv);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                alertDiv.classList.add('fade-out');
                setTimeout(() => alertDiv.remove(), 300);
            }, 5000);
        }

        // Logout function
        function logout() {
            fetch('/api/logout', {
                method: 'POST',
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    sessionStorage.removeItem('currentUser');
                    currentUser = null;
                    showPage('home');
                    updateNavigation();
                    showAlert('You have been logged out.', 'info');
                }
            })
            .catch(error => {
                console.error('Logout error:', error);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Load user from session if exists
            const savedUser = sessionStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }
            
            // Initialize UI
            updateNavigation();
            showPage('home');
            
            // Add any additional initialization code here
        });
    </script>
</body>
</html>
