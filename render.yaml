services:
  - type: web
    name: geu-connect-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: geu-connect-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_ENV
        value: production
      - key: SKIP_VENV_BOOTSTRAP
        value: "1"

  - type: web
    name: geu-connect-static
    runtime: static
    plan: free
    buildCommand: ./scripts/build-static.sh
    staticPublishPath: public
    envVars:
      - key: API_BASE_URL
        sync: false

databases:
  - name: geu-connect-db
    plan: free
    databaseName: geu_connect
    user: geu_connect_user
